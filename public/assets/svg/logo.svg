<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Envelope Icon with Heart -->
  <g transform="translate(2, 4)">
    <!-- Envelope body -->
    <rect x="0" y="10" width="36" height="26" rx="3" fill="url(#logoGrad)" opacity="0.15"/>
    <rect x="0" y="10" width="36" height="26" rx="3" stroke="url(#logoGrad)" stroke-width="2" fill="none"/>
    <!-- Envelope flap -->
    <path d="M1 11 L18 26 L35 11" stroke="url(#logoGrad)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Heart -->
    <path d="M18 18 C18 15, 13 13, 13 16 C13 19, 18 22, 18 22 C18 22, 23 19, 23 16 C23 13, 18 15, 18 18Z" fill="url(#logoGrad)"/>
  </g>
  <!-- Text: ExoInvite -->
  <text x="46" y="34" font-family="'Outfit', 'Segoe UI', sans-serif" font-weight="700" font-size="28" fill="url(#logoGrad)">
    <tspan>Exo</tspan><tspan font-weight="400">Invite</tspan>
  </text>
</svg>
