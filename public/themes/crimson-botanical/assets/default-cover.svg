<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="cbCovBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7D1825"/>
      <stop offset="52%" stop-color="#580F19"/>
      <stop offset="100%" stop-color="#35070D"/>
    </linearGradient>
    <radialGradient id="cbSunGlow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#F6E3BA" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#C59B5F" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#35070D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cbGoldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3DFB6"/>
      <stop offset="50%" stop-color="#C89D62"/>
      <stop offset="100%" stop-color="#9A723B"/>
    </linearGradient>
    <linearGradient id="cbRoseLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7E5DC"/>
      <stop offset="100%" stop-color="#DFB8A8"/>
    </linearGradient>
    <linearGradient id="cbRoseCrimson" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8293D"/>
      <stop offset="100%" stop-color="#6B101C"/>
    </linearGradient>
  </defs>

  <!-- Rich Crimson Velvet Backdrop -->
  <rect width="600" height="800" fill="url(#cbCovBg)"/>
  <rect width="600" height="800" fill="url(#cbSunGlow)"/>

  <!-- Ambient Starlight Bokeh Dust -->
  <g fill="#F3DFB6">
    <circle cx="130" cy="180" r="2.2" fill-opacity="0.45"/>
    <circle cx="475" cy="195" r="2.5" fill-opacity="0.4"/>
    <circle cx="175" cy="120" r="1.8" fill-opacity="0.35"/>
    <circle cx="420" cy="115" r="2" fill-opacity="0.5"/>
    <circle cx="110" cy="490" r="2" fill-opacity="0.35"/>
    <circle cx="490" cy="510" r="2.4" fill-opacity="0.4"/>
    <circle cx="300" cy="105" r="2.8" fill-opacity="0.55"/>
  </g>

  <!-- Outer & Inner Cathedral Gold Filigree Archways -->
  <path d="M58 765 L58 295 C58 135 542 135 542 295 L542 765" fill="none" stroke="url(#cbGoldGrad)" stroke-opacity="0.48" stroke-width="2"/>
  <path d="M84 765 L84 302 C84 166 516 166 516 302 L516 765" fill="none" stroke="url(#cbGoldGrad)" stroke-opacity="0.72" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M112 765 L112 315 C112 198 488 198 488 315 L488 765" fill="none" stroke="#F3DFB6" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Subtle Sunburst Filigree Rays Behind Central Crest -->
  <g stroke="url(#cbGoldGrad)" stroke-opacity="0.22" stroke-width="1.2">
    <line x1="300" y1="160" x2="300" y2="520"/>
    <line x1="120" y1="340" x2="480" y2="340"/>
    <line x1="172" y1="212" x2="428" y2="468"/>
    <line x1="428" y1="212" x2="172" y2="468"/>
    <line x1="230" y1="175" x2="370" y2="505"/>
    <line x1="370" y1="175" x2="230" y2="505"/>
  </g>

  <!-- Central Botanical Gold Laurel & Eucalyptus Wreath -->
  <circle cx="300" cy="340" r="138" fill="#460A12" fill-opacity="0.42" stroke="url(#cbGoldGrad)" stroke-width="2" stroke-opacity="0.85"/>
  <circle cx="300" cy="340" r="126" fill="none" stroke="#F3DFB6" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 4"/>

  <!-- Left Olive & Eucalyptus Sprig on Wreath -->
  <g fill="url(#cbGoldGrad)" fill-opacity="0.82">
    <path d="M168 380 C150 365 148 345 162 332 C174 348 175 366 168 380 Z"/>
    <path d="M164 330 C152 310 156 288 174 278 C180 296 176 315 164 330 Z"/>
    <path d="M175 276 C170 254 180 232 200 226 C200 245 190 264 175 276 Z"/>
    <path d="M202 225 C205 204 222 190 242 192 C234 208 218 220 202 225 Z"/>
    <!-- Right Olive & Eucalyptus Sprig on Wreath -->
    <path d="M432 380 C450 365 452 345 438 332 C426 348 425 366 432 380 Z"/>
    <path d="M436 330 C448 310 444 288 426 278 C420 296 424 315 436 330 Z"/>
    <path d="M425 276 C430 254 420 232 400 226 C400 245 410 264 425 276 Z"/>
    <path d="M398 225 C395 204 378 190 358 192 C366 208 382 220 398 225 Z"/>
  </g>

  <!-- Top Keystone Crown / Diamond Star Above Wreath -->
  <polygon points="300,152 310,174 334,174 314,188 322,210 300,196 278,210 286,188 266,174 290,174" fill="url(#cbGoldGrad)" fill-opacity="0.9"/>

  <!-- Interlocking Gold Wedding Rings in Center of Wreath -->
  <g fill="none" stroke="url(#cbGoldGrad)">
    <!-- Left Ring -->
    <circle cx="272" cy="352" r="46" stroke-width="7" stroke-opacity="0.95"/>
    <circle cx="272" cy="352" r="40" stroke-width="1.2" stroke="#F7E5DC" stroke-opacity="0.55"/>
    <!-- Right Ring -->
    <circle cx="328" cy="352" r="46" stroke-width="7" stroke-opacity="0.95"/>
    <circle cx="328" cy="352" r="40" stroke-width="1.2" stroke="#F7E5DC" stroke-opacity="0.55"/>
  </g>

  <!-- Faceted Solitaire Diamond on Top of Right Ring -->
  <g transform="translate(328, 292)">
    <polygon points="0,-20 18,-8 11,12 -11,12 -18,-8" fill="#F9EFE2" stroke="url(#cbGoldGrad)" stroke-width="2.2"/>
    <polyline points="-18,-8 18,-8" stroke="url(#cbGoldGrad)" stroke-width="1.5"/>
    <polyline points="-11,12 0,-20 11,12" fill="none" stroke="url(#cbGoldGrad)" stroke-width="1.3"/>
    <!-- Diamond Sparkle Rays -->
    <line x1="0" y1="-34" x2="0" y2="-25" stroke="#F9EFE2" stroke-width="2" stroke-linecap="round"/>
    <line x1="-22" y1="-24" x2="-15" y2="-18" stroke="#F9EFE2" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="-24" x2="15" y2="-18" stroke="#F9EFE2" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Lush Botanical Arrangement at Base of Arch (Sage Leaves, Crimson & Ivory Roses) -->
  <g transform="translate(300, 565)">
    <!-- Trailing Gold & Sage Leaves -->
    <path d="M0,10 C-70,-10 -140,25 -185,65 C-135,55 -75,45 0,25 Z" fill="#4E6E5D" fill-opacity="0.85"/>
    <path d="M0,10 C70,-10 140,25 185,65 C135,55 75,45 0,25 Z" fill="#4E6E5D" fill-opacity="0.85"/>
    <path d="M-20,0 C-85,-35 -145,-15 -175,20 C-125,18 -75,15 -20,12 Z" fill="url(#cbGoldGrad)" fill-opacity="0.65"/>
    <path d="M20,0 C85,-35 145,-15 175,20 C125,18 75,15 20,12 Z" fill="url(#cbGoldGrad)" fill-opacity="0.65"/>

    <!-- Left Ivory Rose Blossom -->
    <g transform="translate(-72, 14)">
      <circle cx="0" cy="0" r="30" fill="url(#cbRoseLight)"/>
      <path d="M-18,-6 C-8,-22 14,-20 20,-4 C24,12 6,24 -10,18 C-24,12 -22,-8 -8,-12 C4,-16 14,-4 8,6 C4,12 -6,10 -8,2" fill="none" stroke="#8B1E2B" stroke-opacity="0.45" stroke-width="2"/>
    </g>

    <!-- Right Ivory Rose Blossom -->
    <g transform="translate(72, 14)">
      <circle cx="0" cy="0" r="30" fill="url(#cbRoseLight)"/>
      <path d="M-18,-6 C-8,-22 14,-20 20,-4 C24,12 6,24 -10,18 C-24,12 -22,-8 -8,-12 C4,-16 14,-4 8,6 C4,12 -6,10 -8,2" fill="none" stroke="#8B1E2B" stroke-opacity="0.45" stroke-width="2"/>
    </g>

    <!-- Center Grand Crimson Rose Blossom -->
    <g transform="translate(0, 6)">
      <circle cx="0" cy="0" r="42" fill="url(#cbRoseCrimson)" stroke="url(#cbGoldGrad)" stroke-width="2"/>
      <path d="M-24,-8 C-10,-28 18,-26 26,-6 C32,14 10,30 -12,24 C-30,18 -28,-10 -10,-16 C6,-22 18,-6 10,8 C4,16 -8,14 -10,4" fill="none" stroke="#F3DFB6" stroke-opacity="0.78" stroke-width="2.2"/>
      <circle cx="0" cy="0" r="4" fill="#F3DFB6"/>
    </g>
  </g>

  <!-- Editorial Caption Banner Inside Arch Bottom -->
  <text x="300" y="675" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="23" fill="#F6E5C4" letter-spacing="1">Two Souls, One Eternal Promise</text>
  <line x1="210" y1="698" x2="390" y2="698" stroke="url(#cbGoldGrad)" stroke-width="1.2" stroke-opacity="0.7"/>
  <text x="300" y="724" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#D8B377" letter-spacing="6">CRIMSON BOTANICAL</text>
</svg>
