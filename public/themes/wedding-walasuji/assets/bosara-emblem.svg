<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="domeGrad" cx="42%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#C92A37"/>
      <stop offset="55%" stop-color="#8F1523"/>
      <stop offset="100%" stop-color="#4A070F"/>
    </radialGradient>
    <linearGradient id="goldMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F9E7B2"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C621B"/>
    </linearGradient>
  </defs>
  <!-- Aura ring -->
  <circle cx="200" cy="200" r="158" fill="#5B0B14" fill-opacity="0.22" stroke="#D4AF37" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="6 6"/>
