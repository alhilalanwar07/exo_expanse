  <path d="M84 226 C88 134 142 90 200 90 C258 90 312 134 316 226 Z" fill="url(#domeGrad)" stroke="url(#goldMetal)" stroke-width="4"/>
  <!-- Gold filigree vertical ribs & diamond embroidery on dome -->
