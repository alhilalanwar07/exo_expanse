  <path d="M144 106 Q130 165 128 226" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <path d="M256 106 Q270 165 272 226" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <polygon points="200,136 224,168 200,200 176,168" fill="#5B0B14" stroke="#F1D68A" stroke-width="2"/>
  <polygon points="200,150 212,168 200,186 188,168" fill="#D4AF37"/>
  <!-- Platter rim & scalloped skirt -->
  <ellipse cx="200" cy="230" rx="134" ry="18" fill="url(#goldMetal)" stroke="#5B0B14" stroke-width="2"/>
  <path d="M74 234 Q105 260 137 238 Q168 262 200 238 Q232 262 263 238 Q295 260 326 234 L310 258 L90 258 Z" fill="#8F1523" stroke="#D4AF37" stroke-width="2"/>
  <!-- Pedestal base -->
  <path d="M168 258 L232 258 L220 302 L180 302 Z" fill="url(#goldMetal)" stroke="#5B0B14" stroke-width="2"/>
  <path d="M126 302 L274 302 L292 326 L108 326 Z" fill="url(#goldMetal)" stroke="#5B0B14" stroke-width="2"/>
  <rect x="102" y="326" width="196" height="10" rx="5" fill="#5B0B14" stroke="#D4AF37" stroke-width="1.5"/>
</svg>
