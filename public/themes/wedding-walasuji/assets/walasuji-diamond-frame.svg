<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="walasujiGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F9E7B2"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A721E"/>
    </linearGradient>
  </defs>
  <!-- Outer double diamond rings (center remains transparent so clipped photo shows cleanly!) -->
  <polygon points="250,42 458,250 250,458 42,250" fill="none" stroke="url(#walasujiGold)" stroke-width="10"/>
  <polygon points="250,58 442,250 250,442 58,250" fill="none" stroke="#8F1523" stroke-width="5"/>
  <polygon points="250,66 434,250 250,434 66,250" fill="none" stroke="#F1D68A" stroke-width="2.5"/>
  <!-- Woven lattice ticks along the 4 edges -->
  <g stroke="#F1D68A" stroke-width="2" stroke-opacity="0.85">
    <line x1="185" y1="95" x2="205" y2="115"/><line x1="145" y1="135" x2="165" y2="155"/><line x1="105" y1="175" x2="125" y2="195"/>
    <line x1="315" y1="95" x2="295" y2="115"/><line x1="355" y1="135" x2="335" y2="155"/><line x1="395" y1="175" x2="375" y2="195"/>
    <line x1="185" y1="405" x2="205" y2="385"/><line x1="145" y1="365" x2="165" y2="345"/><line x1="105" y1="325" x2="125" y2="305"/>
    <line x1="315" y1="405" x2="295" y2="385"/><line x1="355" y1="365" x2="335" y2="345"/><line x1="395" y1="325" x2="375" y2="305"/>
  </g>
  <!-- Top floral medallion crest -->
  <g transform="translate(250, 40)">
    <circle cx="-18" cy="4" r="11" fill="#B9232E" stroke="#F1D68A" stroke-width="1.5"/>
    <circle cx="18" cy="4" r="11" fill="#B9232E" stroke="#F1D68A" stroke-width="1.5"/>
    <polygon points="0,-24 20,0 0,24 -20,0" fill="#5B0B14" stroke="#F1D68A" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="7" fill="#D4AF37"/>
  </g>
  <!-- Side diamond filigree caps -->
  <polygon points="42,232 60,250 42,268 24,250" fill="#8F1523" stroke="#F1D68A" stroke-width="2"/>
  <polygon points="458,232 476,250 458,268 440,250" fill="#8F1523" stroke="#F1D68A" stroke-width="2"/>
  <!-- Bottom jewel & hanging crimson-gold tassel -->
  <polygon points="250,440 268,458 250,476 232,458" fill="#8F1523" stroke="#F1D68A" stroke-width="2"/>
  <line x1="250" y1="476" x2="250" y2="496" stroke="#D4AF37" stroke-width="2.5"/>
</svg>
