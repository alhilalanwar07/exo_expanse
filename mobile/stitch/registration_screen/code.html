<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center">

<nav class="fixed top-0 w-full z-50 bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl flex items-center px-4 h-16 w-full">
<button class="p-2 transition-transform duration-200 ease-in-out active:scale-95 text-violet-700 dark:text-violet-400">

<h1 class="font-['Plus_Jakarta_Sans'] text-lg font-bold tracking-tight text-violet-700 dark:text-violet-400 ml-2">Daftar Akun Baru</h1>
</nav>
<main class="w-full max-w-md px-6 pt-24 pb-12 flex-grow flex flex-col">
<!-- Header -->
<header class="mb-10">
<h2 class="font-headline text-3xl font-extrabold tracking-tight text-on-surface mb-2">Daftar Akun Baru</h2>
<p class="font-body text-on-surface-variant text-sm leading-relaxed">Bergabunglah dengan Exoinvite dan mulailah menciptakan momen spesial Anda.</p>
</header>
<!-- Form Section -->
<section class="space-y-6">
<!-- Full Name -->
<div class="space-y-1.5">
<label class="font-label text-[10px] font-bold uppercase tracking-[0.05rem] text-on-surface-variant ml-1">Nama Lengkap</label>
<input class="w-full h-14 px-5 bg-surface-container-highest border-none rounded-xl focus:ring-2 focus:ring-primary/20 transition-all font-body text-on-surface placeholder:text-outline/60" placeholder="Masukkan nama lengkap" type="text"/>
</div>
<!-- Email Address -->
<div class="space-y-1.5">
<label class="font-label text-[10px] font-bold uppercase tracking-[0.05rem] text-on-surface-variant ml-1">Alamat Email</label>
<input class="w-full h-14 px-5 bg-surface-container-highest border-none rounded-xl focus:ring-2 focus:ring-primary/20 transition-all font-body text-on-surface placeholder:text-outline/60" placeholder="contoh@email.com" type="email"/>
</div>
<!-- Password -->
<div class="space-y-1.5">
<label class="font-label text-[10px] font-bold uppercase tracking-[0.05rem] text-on-surface-variant ml-1">Kata Sandi</label>
<div class="relative">
<input class="w-full h-14 px-5 bg-surface-container-highest border-none rounded-xl focus:ring-2 focus:ring-primary/20 transition-all font-body text-on-surface placeholder:text-outline/60" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div class="space-y-1.5">
<label class="font-label text-[10px] font-bold uppercase tracking-[0.05rem] text-on-surface-variant ml-1">Konfirmasi Kata Sandi</label>
<div class="relative">
<input class="w-full h-14 px-5 bg-surface-container-highest border-none rounded-xl focus:ring-2 focus:ring-primary/20 transition-all font-body text-on-surface placeholder:text-outline/60" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Legal Compliance -->
<div class="flex items-start gap-3 px-1">
<div class="relative flex items-center pt-0.5">
<input class="w-5 h-5 rounded border-outline-variant bg-surface-container-lowest text-primary focus:ring-offset-0 focus:ring-primary/20" id="terms" type="checkbox"/>
</div>
<label class="font-body text-xs text-on-surface-variant leading-relaxed" for="terms">
                    Saya menyetujui <a class="text-primary font-bold" href="#">Syarat &amp; Ketentuan</a> dan <a class="text-primary font-bold" href="#">Kebijakan Privasi</a>
</label>
</div>
<!-- Primary Action -->
<button class="w-full h-14 editorial-gradient text-on-primary font-headline font-bold text-base rounded-full transition-transform active:scale-95 shadow-[0_8px_20px_-6px_rgba(99,14,212,0.4)]">
                Daftar
            </button>
</section>
<!-- Divider Section -->
<div class="relative my-10 flex items-center">
<div class="flex-grow h-px bg-outline-variant/30"></div>
<span class="px-4 font-label text-[10px] font-bold uppercase tracking-widest text-outline">Atau daftar dengan</span>

<span class="font-headline font-bold text-sm">Google</span>

</p>
